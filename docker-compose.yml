services:
  app:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - chroma_data:/app/chroma_db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chroma_data:
